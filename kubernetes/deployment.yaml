apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-approval-api
spec:
  replicas: 1

  selector:
    matchLabels:
      app: loan-approval-api

  strategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: loan-approval-api

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: loan-approval-api
          image: ghcr.io/mohansai08/loan-approval-api:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          startupProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
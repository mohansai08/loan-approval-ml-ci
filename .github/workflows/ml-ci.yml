
name: Loan Approval ML CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. Get repository code
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # 3. Install dependencies
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Train the Loan Approval model
      - name: Train Loan Approval model
        run: python train_model.py

      # 5. Validate model accuracy
      - name: Check ML quality gate
        run: python quality_gate.py

      # 6. Run existing ML pipeline tests
      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline.py -v

      # 7. Test the Flask prediction API
      - name: Run prediction application tests
        run: python -m unittest test_app.py -v

      # 8. Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 9. Build Docker image with registry tags
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/loan-approval-api:v1 \
            -t ghcr.io/${{ github.repository_owner }}/loan-approval-api:latest \
            .

      # 10. Start Docker container
      - name: Start Docker container
        run: |
          docker run -d \
            --name loan-approval-container \
            -p 5000:5000 \
            ghcr.io/${{ github.repository_owner }}/loan-approval-api:v1

      # 11. Wait for Flask application to become ready
      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done

          echo "Application did not become ready."
          docker logs loan-approval-container
          exit 1

      # 12. Test Docker prediction endpoint
      - name: Test Docker prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "credit_score": 750,
              "loan_percent_income": 0.20,
              "person_income": 75000,
              "loan_amnt": 10000
            }' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

          echo "Docker prediction test passed."

      # 13. Capture Docker container logs
      - name: Show Docker container logs
        if: always()
        run: docker logs loan-approval-container || true

      # 14. Stop and remove Docker container
      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f loan-approval-container || true

      # 15. Push Docker image to GitHub Container Registry
      - name: Push Docker image to GHCR
        if: success() && github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/loan-approval-api:v1
          docker push ghcr.io/${{ github.repository_owner }}/loan-approval-api:latest

      # 16. Prepare the Docker-ready release candidate
      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp loan_approval_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/
          printf 'Loan Approval Prediction ML Application\nRun: python app.py\nEndpoint: POST /predict\n' > release_candidate/DEPLOYMENT.txt

      # 17. Preserve the Practical 4 ML artifacts
      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v7
        with:
          name: loan-approval-ml-artifacts
          path: |
            loan_approval_model.pkl
            metrics.json
            loan_approval_ci_data.csv
          if-no-files-found: error
          retention-days: 7

      # 18. Upload the Practical 5 release candidate
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: loan-approval-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7
